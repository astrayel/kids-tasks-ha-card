name: Manual Release

# Construit dist/ et crée un tag + release GitHub depuis la branche choisie.
# Déclenchement manuel : Actions → Manual Release → Run workflow (choisir la
# branche dev pour publier le code le plus récent).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à créer (ex. v2.1.0)"
        required: true
      prerelease:
        description: "Marquer comme pré-version"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Notes de release
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          cat > NOTES.md <<EOF
          ## Kids Tasks Card $TAG

          Cartes Lovelace pour l'intégration Kids Tasks Manager.

          ### Installation
          - **HACS** : dépôt personnalisé, catégorie Lovelace.
          - **Manuelle** : copier \`kids-tasks-card.js\` dans
            \`/config/www/community/kids-tasks-card/\` puis déclarer la ressource.

          Voir le CHANGELOG du dépôt pour le détail des changements.
          EOF

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          FLAGS=(--target "$GITHUB_SHA" --title "Kids Tasks Card $TAG" --notes-file NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}" dist/kids-tasks-card.js
