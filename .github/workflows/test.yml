name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:

jobs:
  service-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check that every kids_tasks service called by the cards exists
        run: node scripts/check-service-calls.js
